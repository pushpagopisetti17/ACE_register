services:
  - type: web
    name: ace2026-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false        # set manually in Render dashboard
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: LINK_TREE
        sync: false
      - key: INV_SERVER_URL
        sync: false
      - key: FRONTEND_URL
        sync: false        # set to your Vercel URL e.g. https://ace2026.vercel.app
